name: ProfileUpdateAutomation Pipeline
on:
    push:
        branches:
        - main
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: "21"
            distribution: "temurin"
            cache: maven

        - name: Build and Run tests
          run: mvn clean test -Dheadless=true

        - name: Attach Cucumber Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Extents-report
            path: test-output/

